name: Publish reviewed voice mod v1.0.3
on:
  push:
    paths: ['.github/workflows/publish-reviewed-v103.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply checksum-verified public source
        shell: python
        run: |
          import hashlib, json, subprocess
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          archive = Path('voice-mod-v1.0.3-source-update.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == 'cbb776e60ff2a38d0236f2705d8282df2cab2513eacaedf390c1a935c076bba3'
          assert json.loads(Path('release.json').read_text())['version'] == '1.0.2'
          baseline = '3ffeddf8eb78084199aa197759651f14a54c3b8a'
          with ZipFile(archive) as z:
              manifest = json.loads(z.read('_release_source_manifest.json'))
              assert set(z.namelist()) == set(manifest) | {'_release_source_manifest.json'}
              assert len(z.namelist()) == len(manifest) + 1
              for name, checksum in manifest.items():
                  path = PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts and ':' not in name and '\\' not in name
                  assert not set(path.parts) & {'.git', '.runtime', '__pycache__', 'runtime', 'saves', 'venv'}
                  original = subprocess.run(['git','show',baseline+':'+name],capture_output=True)
                  current = subprocess.run(['git','show','HEAD:'+name],capture_output=True)
                  assert original.returncode == current.returncode and original.stdout == current.stdout, 'Source changed since review: '+name
                  assert hashlib.sha256(z.read(name)).hexdigest() == checksum
              for name in manifest:
                  target = Path(name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(name))
          archive.unlink()
          Path('.github/workflows/publish-reviewed-v103.yml').unlink()
      - run: python -B -m unittest discover -s tests
      - name: Commit reviewed source
        id: commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release v1.0.3 support for current and previous game builds'
          git push origin HEAD:main
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  release:
    needs: source
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.source.outputs.revision }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -B -m pip install -r requirements-installer.txt
      - run: python -B -m unittest discover -s tests
      - run: python -B tools/build_installer.py
      - run: python -B tools/smoke_installer.py
      - run: python -B tools/build_release_zip.py
      - name: Write release checksum and notes
        shell: python
        run: |
          import hashlib, os
          from pathlib import Path
          archive = Path('ponyponyparadise-voice-mod.zip')
          archive.with_suffix('.sha256').write_text(hashlib.sha256(archive.read_bytes()).hexdigest()+'  '+archive.name+'\n', encoding='ascii')
          notes = """Fixes Apply voices reporting "Unsupported game build" on the current official Windows game download.

          Download ponyponyparadise-voice-mod.zip, extract it, open PonyPonyParadiseVoiceSetup.exe, select your game and OmniVoice, and click Apply voices. Existing mod users can check for updates in setup or use the new installer and apply it to the same game folder.

          - Supports the current October 2026 official Windows export and the previously supported export. Setup chooses the matching patches and preserves the newer game's history, save validation, language and calendar features.
          - Verified fresh installs on both exports and upgrading an existing v1.0.2 mod installation to v1.0.3. Original backups and user files are preserved.
          - Includes 252 ready-to-play opening and Quick Start clips generated at 64 steps, and all 50 English reference voices. Wait for Audio (Recommended) remains the default.
          - Compatibility checks still refuse unknown or modified builds before changing game files. If you also update the base game, uninstall the mod first, update the game, then apply the new mod. Report your game download/version if it remains unsupported.
          - Public source and the packaged installer are checked for credentials, personal paths, local preferences, saves and temporary files before release.
          """
          Path(os.environ['RUNNER_TEMP'], 'voice-release-notes.md').write_text(notes, encoding='utf-8')
      - run: python -B tools/audit_public_repo.py
      - name: Publish validated release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create v1.0.3 ponyponyparadise-voice-mod.zip ponyponyparadise-voice-mod.sha256 --repo $env:GITHUB_REPOSITORY --target '${{ needs.source.outputs.revision }}' --title 'Voice Mod v1.0.3' --notes-file (Join-Path $env:RUNNER_TEMP 'voice-release-notes.md')
          exit $LASTEXITCODE
