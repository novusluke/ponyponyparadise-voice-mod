name: Apply release source
on:
  push:
    paths: ['.github/workflows/apply-release-source.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed source files
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile
          allowed = {'INSTALL.txt', 'README.md', 'THIRD_PARTY_NOTICES.md', 'installer.py', 'release.json', 'game_patch/scripts/voice_mod/voice_version.gd', 'tests/test_installer.py', 'voice_mod/installer_service.py'}
          with ZipFile('release-source-update.zip') as archive:
              assert set(archive.namelist()) == allowed
              for name in allowed:
                  Path(name).write_bytes(archive.read(name))
          Path('release-source-update.zip').unlink()
          Path('.github/workflows/apply-release-source.yml').unlink()
      - name: Commit release source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare initial public release 1.0.0'
          git push origin HEAD:main
