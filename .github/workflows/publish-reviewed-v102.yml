name: Publish reviewed voice mod v1.0.2
on:
  push:
    paths: ['.github/workflows/publish-reviewed-v102.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply checksum-verified public source
        shell: python
        run: |
          import hashlib, json, subprocess
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          archive = Path('voice-mod-v1.0.2-source-update.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '81e7fc7c32dada48dbeb51ca84dbdd441b00b319ca552dd6f3c471f6a279e898'
          assert json.loads(Path('release.json').read_text())['version'] == '1.0.1'
          baseline = '56d70c6389c4fd7856c53e8f568431cdbd245f59'
          with ZipFile(archive) as z:
              manifest = json.loads(z.read('_release_source_manifest.json'))
              assert set(z.namelist()) == set(manifest) | {'_release_source_manifest.json'}
              assert len(z.namelist()) == len(manifest) + 1
              for name, checksum in manifest.items():
                  path = PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts and ':' not in name and '\\' not in name
                  assert not set(path.parts) & {'.git', '.runtime', '__pycache__', 'runtime', 'saves', 'venv'}
                  original = subprocess.run(['git','show',baseline+':'+name],capture_output=True)
                  current = subprocess.run(['git','show','HEAD:'+name],capture_output=True)
                  assert original.returncode == current.returncode and original.stdout == current.stdout, 'Source changed since review: '+name
                  assert hashlib.sha256(z.read(name)).hexdigest() == checksum
              for name in manifest:
                  target = Path(name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(name))
          archive.unlink()
          Path('.github/workflows/publish-reviewed-v102.yml').unlink()
      - run: python -B -m unittest discover -s tests
      - name: Commit reviewed source
        id: commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release v1.0.2 dialogue, voice preparation and installer improvements'
          git push origin HEAD:main
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  release:
    needs: source
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.source.outputs.revision }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -B -m pip install -r requirements-installer.txt
      - run: python -B -m unittest discover -s tests
      - run: python -B tools/build_installer.py
      - run: python -B tools/smoke_installer.py
      - run: python -B tools/build_release_zip.py
      - name: Write release checksum and notes
        shell: python
        run: |
          import hashlib, os
          from pathlib import Path
          archive = Path('ponyponyparadise-voice-mod.zip')
          archive.with_suffix('.sha256').write_text(hashlib.sha256(archive.read_bytes()).hexdigest()+'  '+archive.name+'\n', encoding='ascii')
          notes = """Download the ZIP, extract it, select your game in PonyPonyParadiseVoiceSetup.exe, and click Apply voices.

          - New Game and Quick Start include 252 ready-to-play clips generated at 64 steps, plus all 50 English reference voices.
          - Wait for Audio (Recommended) prepares the whole response, with percentage progress at the bottom right. After 30 seconds, Too slow? offers a steps slider and Apply button with a quality warning. Generation continues through settings and stops at the main menu.
          - Click advances dialogue; dragging selects text. Ctrl+C copies, and Space/Enter advance. The voice toggle is green when enabled.
          - OmniVoice detection checks working dependencies and CUDA, and accepts the project folder, venv, Scripts folder, or Python interpreter.
          - Downloads keep HTTPS certificate verification enabled. Source archives and linked game paths are checked before installation. Fresh CUDA 12.8 setups use PyTorch 2.11.0; existing environments are preserved.
          """
          Path(os.environ['RUNNER_TEMP'], 'voice-release-notes.md').write_text(notes, encoding='utf-8')
      - run: python -B tools/audit_public_repo.py
      - name: Publish validated release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create v1.0.2 ponyponyparadise-voice-mod.zip ponyponyparadise-voice-mod.sha256 --repo $env:GITHUB_REPOSITORY --target '${{ needs.source.outputs.revision }}' --title 'Voice Mod v1.0.2' --notes-file (Join-Path $env:RUNNER_TEMP 'voice-release-notes.md')
          exit $LASTEXITCODE
