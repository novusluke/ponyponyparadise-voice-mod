name: Publish source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack source
        shell: python
        run: |
          import hashlib, zipfile
          from pathlib import Path, PurePosixPath
          archive = Path('source-import.zip')
          expected = '900672bc615637859704e67694bb6cf6d150ca36a659c94e70e53928da7e38f7'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected
          root = Path.cwd().resolve()
          with zipfile.ZipFile(archive) as payload:
              assert len(payload.infolist()) == 313
              for entry in payload.infolist():
                  name = PurePosixPath(entry.filename)
                  assert not name.is_absolute() and '..' not in name.parts
                  assert '.git' not in name.parts and '__pycache__' not in name.parts
                  assert (root / entry.filename).resolve().is_relative_to(root)
              payload.extractall(root)
          archive.unlink()
          Path('.github/workflows/checks.yml').unlink()
          Path('.github/workflows/release.yml').unlink()
          print('Published source files and assets.')
      - name: Commit source tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Add voice mod source and assets'
          git push origin HEAD:main
